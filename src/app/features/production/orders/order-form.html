<div class="of-page">
  <h2 class="of-title">Nueva Orden de Producción</h2>
  <form [formGroup]="form" (ngSubmit)="submit()" class="of-form">
    <app-product-search
      label="Producto (Fórmula) *"
      placeholder="Buscar producto fórmula..."
      (selected)="onFormulaSelected($event)"
    />
    <app-warehouse-picker
      label="Bodega *"
      placeholder="Buscar bodega..."
      (selected)="onWarehouseSelected($event)"
    />
    <div class="of-grid">
      <mat-form-field appearance="outline">
        <mat-label>Fecha planificada *</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="plannedDate" />
        <mat-datepicker-toggle matSuffix [for]="picker" /><mat-datepicker #picker />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Cantidad planificada *</mat-label>
        <input matInput type="number" formControlName="plannedQuantity" min="0.001" step="0.001" />
      </mat-form-field>
    </div>
    <mat-form-field appearance="outline"
      ><mat-label>Notas</mat-label><textarea matInput formControlName="notes" rows="2"></textarea>
    </mat-form-field>
    @if (error()) {
      <p class="of-error">{{ error() }}</p>
    }
    <div class="of-actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="saving() || form.invalid">
        @if (saving()) {
          <mat-spinner diameter="18" />
        } @else {
          <mat-icon>check</mat-icon>
        }
        Crear orden
      </button>
    </div>
  </form>
</div>
