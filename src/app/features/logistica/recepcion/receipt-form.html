<div class="form-container">
  <h2>Nueva Recepción</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="receipt-form">
    <div class="form-row">
      <mat-form-field>
        <mat-label>Número de recibo</mat-label>
        <input matInput formControlName="receiptNumber" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Fecha</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="receiptDate" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field>
        <mat-label>Bodega</mat-label>
        <mat-select formControlName="warehouseId">
          @for (w of warehouses(); track w.id) {
            <mat-option [value]="w.id">{{ w.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Proveedor (opcional)</mat-label>
        <input matInput formControlName="supplierId" />
      </mat-form-field>
    </div>

    <mat-form-field>
      <mat-label>Notas</mat-label>
      <textarea matInput formControlName="notes" rows="2"></textarea>
    </mat-form-field>

    <div class="lines-section">
      <div class="lines-header">
        <h3>Productos</h3>
        <button type="button" mat-stroked-button (click)="addLine()">
          <mat-icon>add</mat-icon> Agregar
        </button>
      </div>

      <div formArrayName="linesArray">
        @for (line of linesArray.controls; track $index) {
          <div [formGroupName]="$index" class="line-row">
            <input type="hidden" formControlName="productId" />
            <app-product-search
              (selected)="onLineProductSelected($index, $event)"
              label="Producto"
            ></app-product-search>
            <input type="hidden" formControlName="warehouseId" />
            <app-warehouse-picker
              (selected)="onLineWarehouseSelected($index, $event)"
              label="Bodega destino"
            ></app-warehouse-picker>
            <mat-form-field>
              <mat-label>Cantidad</mat-label>
              <input matInput type="number" formControlName="receivedQuantity" />
            </mat-form-field>
            <mat-form-field>
              <mat-label>Costo unitario</mat-label>
              <input matInput type="number" formControlName="unitCost" />
            </mat-form-field>
            <button type="button" mat-icon-button color="warn" (click)="removeLine($index)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        }
      </div>
    </div>

    <div class="form-actions">
      <a mat-button routerLink="..">Cancelar</a>
      <button mat-flat-button type="submit" [disabled]="form.invalid || saving()">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
