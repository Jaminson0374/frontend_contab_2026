<h2 mat-dialog-title>Editar permisos — {{ data.role.name }}</h2>

<mat-dialog-content>
  <p class="red-desc">Seleccioná los permisos para este rol:</p>

  <form [formGroup]="form" class="red-form">
    @for (mod of modules; track mod.key) {
      <mat-checkbox [formControlName]="mod.key" [class.dangerous]="mod.dangerous">
        {{ mod.label }}
      </mat-checkbox>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="saving()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="saving()">
    @if (saving()) {
      <mat-spinner diameter="20" color="accent" />
    } @else {
      Guardar
    }
  </button>
</mat-dialog-actions>
